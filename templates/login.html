<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        #user-form {
            background: #ffffff;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--primary-color);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .form-item {
            margin-bottom: 1.25rem;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Checkbox Styling */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        #remember-me {
            width: 1rem;
            height: 1rem;
            accent-color: var(--primary-color);
        }

        /* Error Message */
        #error-msg {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            border: 1px solid #fecaca;
            text-align: center;
        }

        /* Submit Button */
        #form-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 0.5rem;
        }

        #form-submit:hover {
            background: var(--primary-hover);
        }

        /* Footer Links */
        #switch-form {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .text-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .text-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <form id="user-form" action="/login" method="post">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please enter your details to login</p>

        {% if error %}
            <p id="error-msg"><i class="fas fa-circle-exclamation"></i> {{error}}</p>
        {% endif %}

        <div class="form-item">
            <label for="user-username">Username</label>
            <input id="user-username" class="form-input" type="text" name="username" placeholder="Enter your username" required>
        </div>

        <div class="form-item">
            <label for="user-password">Password</label>
            <input id="user-password" class="form-input" type="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-item">
            <label class="checkbox-container">
                <input type="checkbox" id="remember-me" name="remember-me">
                Remember me
            </label>
        </div>

        <input id="form-submit" type="submit" value="Sign In">

        <div id="switch-form">
            <p>Don't have an account? <a class="text-link" href="/register">Create account</a></p>
        </div>
    </form>

</body>
</html>
