<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Detection | Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --success: #2ecc71;
            --danger: #e74c3c;
            --text-dark: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
            background-image: radial-gradient(circle at 20% 20%, #e0e7ff 0%, transparent 40%),
                              radial-gradient(circle at 80% 80%, #fae8ff 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 550px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .heading_font {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: block;
        }

        .results {
            margin: 2rem 0;
            padding: 20px;
            border-radius: 15px;
        }

        /* Result States */
        .status-msg {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .safe-text { color: var(--success); }
        .danger-text { color: var(--danger); }

        .result-gif {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary-grad);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #764ba2;
            border: 2px solid #764ba2;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary:hover { background: #f8f9fa; }

        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            .btn-container { flex-direction: column; }
        }
    </style>
</head>

<body>

    <div class="container">
        <form action="{{ url_for('predict')}}" method="post">
            <span class="heading_font">Detection Results</span>

            <div class="results">
                {% if prediction == 1 %}
                    <div class="status-msg safe-text">
                        <i class="fas fa-check-circle"></i> <br>
                        Card is Original
                    </div>
                    <img class="result-gif" src="{{ url_for('static', filename='credit-card real.gif')}}" alt="Genuine Card">
                {% elif prediction == 0 %}
                    <div class="status-msg danger-text">
                        <i class="fas fa-exclamation-triangle"></i> <br>
                        Card is Fake
                    </div>
                    <img class="result-gif" src="{{ url_for('static', filename='giphy fake.webp')}}" alt="Fake Card">
                {% endif %}
            </div>

            <div class="btn-container">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-chart-line"></i> Home
                </a>
                <a href="/predict1" class="btn btn-secondary">
                    <i class="fas fa-project-diagram"></i>Predict Again
                </a>
            </div>
        </form>
    </div>

</body>
</html>
